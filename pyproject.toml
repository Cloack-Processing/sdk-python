[project]
name = "cloakprocessing"
version = "1.2.0"
description = "Python SDK for the CloakProcessing anonymous media API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ghostmark", email = "support@cloakprocessing.com" }]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
]
keywords = ["media", "watermark", "webp", "webm", "api-client", "cloakprocessing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
"Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.5",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://cloakprocessing.com"
Documentation = "https://cloakprocessing.com/docs"
Support = "https://cloakprocessing.com/support"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloakprocessing*"]

[tool.setuptools.package-data]
"cloakprocessing" = ["py.typed"]
